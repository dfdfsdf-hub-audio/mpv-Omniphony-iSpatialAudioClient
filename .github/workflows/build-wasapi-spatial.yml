name: Windows WASAPI Spatial Audio Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wasapi-spatial-audio-orender
    paths:
      - 'audio/out/**'
      - 'meson.build'
      - 'ci/build-win32-spatial.ps1'
      - '.github/workflows/build-wasapi-spatial.yml'

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 - WASAPI Spatial Audio
    runs-on: windows-latest

    env:
      VS: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
      CC: 'ccache clang'
      CXX: 'ccache clang++'
      CC_LD: lld-link
      CXX_LD: lld-link
      WINDRES: llvm-rc
      RUST_LD: lld-link
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: '${{ github.workspace }}\.ccache'
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install meson==1.9.2
          choco install ccache nasm -y
          ./ci/install-cmake.ps1 -arch x64

      - name: Update Meson WrapDB
        shell: pwsh
        run: |
          meson wrap update-db
          meson wrap install expat
          meson wrap install harfbuzz
          meson wrap install libpng
          meson wrap install zlib

      - name: Build mpv with WASAPI Spatial Audio
        id: build
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -ne 'C:\Program Files\LLVM\bin' -and
            $_ -ne 'C:\Program Files\CMake\bin' -and
            $_ -ne 'C:\Strawberry\c\bin'
          }) -join ';'

          $env:PATH = "$pwd\cmake\bin;" + $env:PATH + ';C:\Program Files\NASM'

          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"

          Enter-VsDevShell -VsInstallPath $env:VS `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64"

          ./ci/build-win32-spatial.ps1

      - name: Print Meson build log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        shell: pwsh
        run: |
          if (Test-Path './build-spatial/meson-logs/meson-log.txt') {
            Get-Content './build-spatial/meson-logs/meson-log.txt'
          }

      - name: Run Meson tests
        id: tests
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -ne 'C:\Program Files\LLVM\bin' -and
            $_ -ne 'C:\Program Files\CMake\bin' -and
            $_ -ne 'C:\Strawberry\c\bin'
          }) -join ';'

          $env:PATH = "$pwd\cmake\bin;" + $env:PATH + ';C:\Program Files\NASM'

          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"

          Enter-VsDevShell -VsInstallPath $env:VS `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64"

          meson test -C build-spatial -t 2

      - name: Print Meson test log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        shell: pwsh
        run: |
          if (Test-Path './build-spatial/meson-logs/testlog.txt') {
            Get-Content './build-spatial/meson-logs/testlog.txt'
          }

      - name: Upload Windows build artifacts
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: mpv-wasapi-spatial-windows-x64
          if-no-files-found: error
          path: |
            build-spatial/mpv.exe
            build-spatial/mpv.com
            build-spatial/mpv-*.bat
            build-spatial/vulkan-*.dll
            build-spatial/libmpv.a

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-x64-spatial-${{ github.run_id }}
