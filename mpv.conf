audio-client-name=omniphony
audio-format=f32
audio-silence-cut=no
ao=pipelist:pipe=\\.\pipe\orender.input

# >>> omniphony (managed) >>>
ad=orender
# <<< omniphony (managed) <<<
keep-open=yes
save-position-on-quit=yes
loop-file=inf

# Windows Spatial Audio output backend
ao=wasapi-spatial

# Explicit 7.1.4 speaker layout
# This is essential for unknown12-channel PCM sources.
audio-channels=fl-fr-fc-lfe-bl-br-sl-sr-tfl-tfr-tbl-tbr

# Prevent decoder-side downmixing where supported
ad-lavc-downmix=no

# ============================================
# mpv GPU Hardware Acceleration
# Windows 11 + Intel Arc Graphics
# ============================================

# Video Output
vo=gpu
gpu-context=d3d11

# Hardware Video Decoding
hwdec=d3d11va

# ============================================
# End
# ============================================
